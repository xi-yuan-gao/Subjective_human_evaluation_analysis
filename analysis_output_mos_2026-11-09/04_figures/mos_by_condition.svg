<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="520" viewBox="0 0 1060 520" role="img" aria-labelledby="title desc">
<title id="title">Mean opinion score by condition</title>
<desc id="desc">Mean MOS and listener-level Student-t 95 percent confidence interval for each audio condition, with paired differences.</desc>
<rect width="1060" height="520" fill="#FFFFFF"/>

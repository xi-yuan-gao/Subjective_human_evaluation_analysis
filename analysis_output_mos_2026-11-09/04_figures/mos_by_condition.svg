<text x="230.0" y="160.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#6B7280" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" paint-order="stroke">SD 0.98 · median 3 (IQR 2–3) · 480 ratings, 20 listeners, 48 items</text>

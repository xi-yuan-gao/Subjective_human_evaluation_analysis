<text x="18.0" y="60.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#6B7280">Points are means of listener-level means; whiskers and [brackets] are Student-t 95% confidence intervals. Higher is better.</text>
<line x1="230.0" y1="92.0" x2="230.0" y2="266.0" stroke="#E5E7EB" stroke-width="1"/>
<text x="230.0" y="284.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#6B7280">1 Bad</text>

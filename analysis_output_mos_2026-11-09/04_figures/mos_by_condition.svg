<text x="212.0" y="135.0" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" fill="#1F2937">Blink 3</text>
<line x1="423.2" y1="130.0" x2="478.2" y2="130.0" stroke="#0072B2" stroke-width="2.5"/>
<line x1="423.2" y1="124.0" x2="423.2" y2="136.0" stroke="#0072B2" stroke-width="1.8"/>

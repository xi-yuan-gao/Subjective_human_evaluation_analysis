<text x="200.0" y="312.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#6B7280">Counts — 1: 68 · 2: 115 · 3: 143 · 4: 102 · 5: 52  (n = 480)</text>
<text x="830.0" y="268.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#1F2937">Mean 2.91 [2.66–3.16] · median 3</text>
<text x="830.0" y="286.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#2166AC">Good or excellent (4–5): 32%</text>
<text x="830.0" y="304.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#B2182B">Poor or bad (1–2): 38%</text>

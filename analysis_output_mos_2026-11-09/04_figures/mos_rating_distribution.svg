<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="414" viewBox="0 0 1180 414" role="img" aria-labelledby="title desc">
<title id="title">MOS rating distribution by condition</title>
<desc id="desc">One hundred percent stacked bars show rating proportions from one through five for each condition.</desc>
<rect width="1180" height="414" fill="#FFFFFF"/>
<text x="18.0" y="34.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="500" fill="#1F2937">MOS rating distribution by condition</text>
<text x="18.0" y="60.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#6B7280">Each bar shows the share of ratings at each score; counts below. Right: mean (Student-t 95% CI), median, and share of high (4–5) and low (1–2) ratings.</text>
<rect x="200.0" y="86" width="14" height="14" fill="#B2182B"/>
<text x="220.0" y="98.0" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#1F2937">1 Bad</text>

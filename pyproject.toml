[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcription-analysis"
version = "0.2.0"
description = "Reusable QC and analysis pipeline for counterbalanced transcription experiments"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
transcription-analysis = "transcription_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

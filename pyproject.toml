[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transcription-analysis"
version = "0.2.0"
description = "Reusable QC and analysis pipeline for counterbalanced transcription experiments"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
mixed-effects = [
  "numpy>=1.24,<3",
  "pandas>=2,<3",
  "scipy>=1.10,<2",
  "statsmodels>=0.14,<0.15",
]

[project.scripts]
transcription-analysis = "transcription_analysis.cli:main"
transcription-mixed-effects = "transcription_analysis.mixed_effects:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

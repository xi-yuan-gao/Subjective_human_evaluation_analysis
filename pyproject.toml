[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subjective-human-evaluation-analysis"
version = "0.3.0"
description = "Reusable QC and analysis pipelines for transcription intelligibility and MOS experiments"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
mixed-effects = [
  "numpy>=1.24,<3",
  "pandas>=2,<3",
  "scipy>=1.10,<2",
  "statsmodels>=0.14,<0.15",
]
[project.scripts]
transcription-analysis = "transcription_analysis.cli:main"
transcription-mixed-effects = "transcription_analysis.mixed_effects:main"
mos-analysis = "mos_analysis.analysis_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
